; PlatformIO Project Configuration – TFT-AutoProbe
; Reproduzierbarer Build mit gepinnten Versionen (Plattform + TFT_eSPI),
; damit künftige Library-Updates den Build nicht brechen.
;
; Build:  pio run
; Flash:  pio run -t upload
; Monitor: pio device monitor -b 115200

[platformio]
; Die .ino liegt im Arduino-Sketch-Unterordner src/TFT_AutoProbe/
src_dir = src/TFT_AutoProbe

[platform_base]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200

; ── TFT_eSPI Display-Konfiguration (entspricht src/.../tft_setup.h) ───────────
; Via build_flags statt User_Setup.h → projektlokal, kein Eingriff in die Library.
tft_build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

[env:esp32dev]
extends = platform_base
board = esp32dev
build_flags =
    ${platform_base.tft_build_flags}
lib_deps =
    bodmer/TFT_eSPI@2.5.43
